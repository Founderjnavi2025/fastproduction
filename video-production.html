<!doctype html>
<html lang="id">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Production · FastProduction</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <main class="video-manager">
    <h1>Your Video Production</h1>
    <p>Kelola video workshop milik akunmu.</p>

    <form id="videoForm" class="video-form">
      <input id="videoTitle" type="text"
        placeholder="Judul video" maxlength="120" required>

      <textarea id="videoDescription"
        placeholder="Deskripsi video (opsional)"
        rows="3" maxlength="1000"></textarea>

      <input id="youtubeUrl" type="url"
        placeholder="Tempel link YouTube di sini" required>

      <button id="saveVideoButton" type="submit">
        Tambahkan Video
      </button>

      <button id="cancelEditButton" type="button" hidden>
        Batal Edit
      </button>
    </form>

    <p id="videoMessage" role="status"></p>

    <h2>Video Saya</h2>
    <div id="myVideoList">
      <p>Memuat video...</p>
    </div>

    <a href="profile.html">← Kembali ke Profil</a>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/logout.js"></script>
  <script src="assets/js/video-production.js"></script>
</body>
</html>
