<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Scope - FastProduction</title>
  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    body {
      background: #f5f7fb;
      color: #202938;
    }

    .global-container {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .global-header {
      margin-bottom: 28px;
    }

    .global-header h1 {
      font-size: clamp(24px, 5vw, 32px);
      margin: 0 0 8px;
      letter-spacing: -0.8px;
    }

    .global-header p {
      margin: 0;
      color: #687386;
      font-size: 14px;
      line-height: 1.6;
    }

    #scopeMessage {
      padding: 12px 15px;
      margin-bottom: 22px;
      border-radius: 9px;
      background: #edf3ff;
      color: #315da8;
      font-size: 13px;
    }

    .global-section {
      margin-bottom: 34px;
    }

    .global-section h2 {
      font-size: 18px;
      margin: 0 0 14px;
      letter-spacing: -0.3px;
    }

    .scope-card {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(20, 35, 60, 0.035);
    }

    .scope-card h3 {
      font-size: 16px;
      margin: 0 0 8px;
      color: #202938;
    }

    .scope-card p {
      font-size: 13px;
      line-height: 1.6;
      color: #697586;
      margin: 6px 0;
      overflow-wrap: anywhere;
    }

    .scope-card p:nth-of-type(2) {
      color: #253a58;
      font-weight: 600;
    }

    .scope-card button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 16px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .scope-card button:hover {
      background: #1d4ed8;
    }

    @media (max-width: 600px) {
      .global-container {
        width: calc(100% - 24px);
        padding-top: 22px;
      }

      .scope-card {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <main class="global-container">
    <header class="global-header">
      <h1>Global Scope</h1>
      <p>Temukan pekerjaan produksi dari seluruh jaringan FastProduction.</p>
    </header>

    <section id="scopeMessage">
      Memuat pekerjaan produksi...
    </section>

    <div id="scopeList"></div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/global-scope.js"></script>

</body>
</html>
