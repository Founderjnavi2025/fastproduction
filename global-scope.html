<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Scope - FastProduction</title>
  <link rel="stylesheet" href="assets/css/app.css">

  <style>
    body {
      background: #f5f7fb;
      color: #202938;
    }

    .global-container {
      width: min(100% - 32px, 960px);
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .global-header {
      margin-bottom: 28px;
    }

    .global-header h1 {
      font-size: clamp(24px, 5vw, 32px);
      margin: 0 0 8px;
      letter-spacing: -0.8px;
    }

    .global-header p {
      margin: 0;
      color: #687386;
      font-size: 14px;
      line-height: 1.6;
    }

    #scopeMessage {
      padding: 12px 15px;
      margin-bottom: 22px;
      border-radius: 9px;
      background: #edf3ff;
      color: #315da8;
      font-size: 13px;
    }

    .global-section {
      margin-bottom: 34px;
    }

    .global-section h2 {
      font-size: 18px;
      margin: 0 0 14px;
      letter-spacing: -0.3px;
    }

    .scope-card {
      background: #fff;
      border: 1px solid #e5e9f0;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(20, 35, 60, 0.035);
    }

    .scope-card h3 {
      font-size: 16px;
      margin: 0 0 8px;
      color: #202938;
    }

    .scope-card p {
      font-size: 13px;
      line-height: 1.6;
      color: #697586;
      margin: 6px 0;
      overflow-wrap: anywhere;
    }

    .scope-card p:nth-of-type(2) {
      color: #253a58;
      font-weight: 600;
    }

    .scope-card button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 16px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .scope-card button:hover {
      background: #1d4ed8;
    }

    @media (max-width: 600px) {
      .global-container {
        width: calc(100% - 24px);
        padding-top: 22px;
      }

      .scope-card {
        padding: 15px;
      }
    }
    
.global-section {
  margin-bottom: 32px;
}

.scope-card-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.scope-card-heading h3 {
  margin: 0;
}

.scope-status {
  font-size: 10px;
  font-weight: 700;
  color: #15803d;
  background: #dcfce7;
  padding: 5px 9px;
  border-radius: 20px;
}

.scope-owner {
  margin-top: 8px !important;
}

.scope-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 14px 0;
}

.scope-stat {
  padding: 12px;
  background: #f5f7fb;
  border-radius: 9px;
  min-width: 0;
}

.scope-stat strong,
.scope-stat small {
  display: block;
}

.scope-stat strong {
  font-size: 16px;
  color: #243b5a;
  overflow-wrap: anywhere;
}

.scope-stat small {
  margin-top: 4px;
  color: #748094;
  font-size: 11px;
}

.scope-jobs-summary {
  font-size: 12px !important;
}

.detail-button,
.publish-button,
.offer-button,
.submit-offer {
  margin: 8px 8px 0 0 !important;
}

.detail-button {
  background: #e8eef9 !important;
  color: #254b83 !important;
}

.publish-button,
.offer-button,
.submit-offer {
  background: #2563eb !important;
  color: white !important;
}

.scope-detail {
  border-top: 1px solid #e5e9f0;
  margin-top: 16px;
  padding-top: 14px;
}

.scope-detail[hidden],
.offer-form[hidden] {
  display: none !important;
}

.offer-form {
  padding: 16px;
  margin-top: 14px;
  background: #f7f9fc;
  border: 1px solid #e5e9f0;
  border-radius: 10px;
}

.offer-form textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #dce2eb;
  border-radius: 8px;
  font: inherit;
}

.job-group {
  border: 1px solid #e0e6ef;
  border-radius: 8px;
  padding: 12px;
  margin: 12px 0;
}

.job-group legend {
  font-size: 12px;
  font-weight: 700;
}

.job-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.job-option {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
}

.offer-item {
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #e5e9f0;
  border-radius: 9px;
  background: white;
}

@media (max-width: 480px) {
  .scope-stat strong {
    font-size: 14px;
  }

  .job-options {
    grid-template-columns: 1fr;
  }
}

  </style>
</head>
<body>

  <main class="global-container">
    <header class="global-header">
      <h1>Global Scope</h1>
      <p>Temukan pekerjaan produksi dari seluruh jaringan FastProduction.</p>
    </header>

    <section id="scopeMessage">
      Memuat pekerjaan produksi...
    </section>

    <div id="scopeList"></div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/global-scope.js"></script>

</body>
</html>
