<!doctype html>
<html lang="id">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventaris Mesin · FastProduction</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <main class="auth-container" style="width:min(650px,calc(100% - 24px))">
    <a href="dashboard.html">← Dashboard</a>

    <h1>Inventaris Mesin</h1>
    <p>Daftarkan mesin yang kamu miliki untuk kebutuhan produksi.</p>

    <section>
      <h2 id="formTitle">Tambah Mesin</h2>

      <form id="machineForm">
        <input type="hidden" id="machineId">

        <label>Merek Mesin</label>
        <select id="brand" required>
          <option value="">Memuat merek...</option>
        </select>

        <label>Kategori Mesin</label>
        <select id="category" required disabled>
          <option value="">Pilih merek terlebih dahulu</option>
        </select>

        <label>Model / Tipe Mesin</label>
        <select id="model" required disabled>
          <option value="">Pilih kategori terlebih dahulu</option>
        </select>

        <p id="catalogInfo" class="catalog-info">
          Pilih merek, kategori, dan model dari katalog.
        </p>

        <input type="hidden" id="machineName">

        <label>Jumlah Mesin</label>
        <input id="quantity" type="number" min="1" value="1" required>

        <label>Kondisi Mesin</label>
        <select id="machineCondition">
          <option value="baik">Baik</option>
          <option value="perlu_perbaikan">Perlu Perbaikan</option>
          <option value="rusak">Rusak</option>
        </select>

        <label>Nama Operator / Pekerja</label>
        <textarea id="operatorNames" rows="3"
          placeholder="Satu nama per baris. Kosongkan jika belum ada operator."></textarea>
        <p class="catalog-info">
          Jika belum ada operator, kamu bisa membuka lamaran dari kartu mesin.
        </p>

        <label>Catatan</label>
        <textarea id="notes" rows="3"
          placeholder="Catatan tambahan..."></textarea>

        <button type="submit" id="saveButton">Simpan Mesin</button>
        <button type="button" class="secondary"
          id="cancelEdit" hidden>Batal Edit</button>
      </form>

      <p id="message"></p>
    </section>

    <section>
      <h2 class="section-title">Mesin Saya</h2>
      <p id="machineCount">Memuat inventaris...</p>
      <div id="machineList"></div>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/logout.js"></script>
  <script src="assets/js/machines.js"></script>
</body>
</html>
